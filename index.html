<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoPredict</title>
<style>
:root{--bg:#f5f6fa;--fg:#151826;--card:#fff;--mut:#6b7185;--line:#e2e5ee;--up:#0f9d58;--dn:#d93025;--acc:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1017;--fg:#e8eaf2;--card:#171a24;--mut:#8b91a7;--line:#262a38;--up:#3ddc84;--dn:#ff6b60;--acc:#8b85ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:440px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:8px 0 4px}
.note{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
button{padding:11px 14px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:6px}.btns button{flex:1}
.big{font-size:28px;font-weight:700}
#msg{margin-top:10px;font-size:14px;min-height:20px}
.err{color:var(--dn)}.ok{color:var(--up)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 CryptoPredict</h1>
  <div class="note">Paper trading with virtual money. Not financial advice.</div>

  <div class="card" id="authCard">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password">
    <div class="btns">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Create account</button>
    </div>
  </div>

  <div class="card hide" id="acctCard">
    <div class="note">Signed in as</div>
    <div class="big" id="uname"></div>
    <div class="note" style="margin-top:10px">Virtual cash</div>
    <div class="big" id="cash"></div>
    <div class="btns"><button id="signout" class="ghost">Sign out</button></div>
  </div>

  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function say(t,cls){var m=$('msg');m.textContent=t;m.className=cls||''}
var C=window.CP_CONFIG||{};
if(!C.SUPABASE_URL||C.SUPABASE_URL.indexOf('PASTE')===0){
  say('Setup needed: add your Supabase URL and key in config.js.','err');
}else{
  var sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);

  async function show(session){
    var on=!!session;
    $('authCard').classList.toggle('hide',on);
    $('acctCard').classList.toggle('hide',!on);
    if(!on)return;
    var p=await sb.from('profiles').select('username').maybeSingle();
    var f=await sb.from('portfolios').select('cash').maybeSingle();
    $('uname').textContent=(p.data&&p.data.username)||'…';
    $('cash').textContent=f.data?'$'+Number(f.data.cash).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'…';
  }

  sb.auth.onAuthStateChange(function(_e,session){show(session)});
  sb.auth.getSession().then(function(r){show(r.data.session)});

  $('signup').onclick=async function(){
    say('Creating account…');
    var r=await sb.auth.signUp({email:$('email').value.trim(),password:$('pw').value});
    if(r.error)return say(r.error.message,'err');
    if(!r.data.session)say('Check your email and click the confirmation link, then sign in.','ok');
    else say('Welcome!','ok');
  };
  $('signin').onclick=async function(){
    say('Signing in…');
    var r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
    if(r.error)return say(r.error.message,'err');
    say('');
  };
  $('signout').onclick=async function(){await sb.auth.signOut();say('Signed out.')};
}
</script>
</body>
</html>
